<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rounded squircle background -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#4a63d6"/>
  <!-- Incoming link entering from the left -->
  <circle cx="22" cy="48" r="7" fill="#ffffff"/>
  <!-- Three routes fanning out to the right, one per space -->
  <path d="M29 48 C 44 48, 44 24, 62 24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M29 48 L 62 48" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M29 48 C 44 48, 44 72, 62 72" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Space markers at the end of each route -->
  <circle cx="72" cy="24" r="8" fill="#ffffff"/>
  <circle cx="72" cy="48" r="8" fill="#ffffff"/>
  <circle cx="72" cy="72" r="8" fill="#ffffff"/>
</svg>
